name: Alerta semanal de cobros

on:
  schedule:
    # Lunes 11:00 UTC = 08:00 ART (Argentina no tiene horario de verano).
    - cron: '0 11 * * 1'
  workflow_dispatch: {} # permite disparar manualmente desde la pestaña Actions

jobs:
  disparar-alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/alertas/semanal
        run: |
          status=$(curl -s -o /tmp/respuesta.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.DASHBOARD_URL }}/api/alertas/semanal")
          echo "HTTP $status"
          cat /tmp/respuesta.json
          if [ "$status" -ne 200 ]; then
            echo "La alerta semanal falló (HTTP $status)"
            exit 1
          fi
